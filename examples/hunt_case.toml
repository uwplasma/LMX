[case]
name = "hunt_ha20_toml"
forcing = 1.0
initial_velocity = 0.0
reference_pressure_gradient = -1.0
reference_phi_cell = [0, 0]
notes = "Explicit Hunt duct example for `lmx input.toml` with conducting Hartmann walls and insulating side walls."

[geometry]
kind = "layered_duct"
width = 2.0
height = 2.0
length = 1.0
nx = 1
ny = 48
nz = 48
wall_thickness = [0.1, 0.1, 0.1, 0.1]
wall_cells = [3, 3, 3, 3]
target_ha = 20.0
target_side_layer = 4.47213595499958

[magnetic_field]
kind = "constant"
value = [0.0, 0.0, 20.0]
ramp_start = 0.0
ramp_duration = 0.0

[solver]
kind = "fully_developed_inductionless"
mode = "steady"
linear_solver = "auto"
preconditioner = "jacobi"
time_scheme = "implicit_euler"
coupling_iterations = 20
coupling_tolerance = 1.0e-8

[time_stepper]
dt = 0.002
t_final = 1.0
max_steps = 500
outer_iterations = 6
potential_iterations = 400
potential_relaxation = 1.0
potential_solver = "cg_volume"
current_reconstruction = "cell_centered"
steady_tolerance = 1.0e-8
steady_potential_tolerance = 1.0e-6
relaxation = 0.1
velocity_update_limit = 0.002
velocity_update_limiter = "global_scale"
checkpoint_stride = 1

[output]
directory = "../artifacts/examples/toml_hunt"
write_paraview = true
write_csv_profiles = true
write_npz = true
write_json_summary = true
write_plots = true
copy_input_file = true
write_stride = 1

[logging]
enabled = true
banner = true
print_regions = true
print_boundaries = true
print_footer = true
flush = true
step_stride = 1

[[regions]]
name = "fluid"
kind = "fluid"
conductivity = 1.0
density = 1.0
viscosity = 0.01

[[regions]]
name = "conducting_wall"
kind = "solid"
conductivity = 0.5
density = 1.0
viscosity = 0.01
wall_thickness = 0.1

[[regions]]
name = "insulating_wall"
kind = "solid"
conductivity = 1.0e-12
density = 1.0
viscosity = 0.01
wall_thickness = 0.1

[[boundary_conditions]]
name = "left_wall"
kind = "insulating"
axis = "y"
side = "left"
region = "insulating_wall"

[[boundary_conditions]]
name = "right_wall"
kind = "insulating"
axis = "y"
side = "right"
region = "insulating_wall"

[[boundary_conditions]]
name = "bottom_wall"
kind = "conducting_wall"
axis = "z"
side = "bottom"
region = "conducting_wall"

[[boundary_conditions]]
name = "top_wall"
kind = "conducting_wall"
axis = "z"
side = "top"
region = "conducting_wall"
