[case]
name = "fringing_layered_toml"
forcing = 1.0
initial_velocity = 0.0
reference_pressure_gradient = -1.0
reference_phi_cell = [1, 1]
notes = "Explicit 3D layered-duct fringing-field example for `lmx input.toml`."

[geometry]
kind = "layered_duct"
width = 2.0
height = 2.0
length = 6.0
nx = 7
ny = 8
nz = 8
wall_thickness = [0.1, 0.1, 0.1, 0.1]
wall_cells = [1, 1, 1, 1]
target_ha = 10.0
target_side_layer = 4.47213595499958

[magnetic_field]
kind = "constant"
value = [0.0, 0.0, 10.0]
ramp_start = 0.0
ramp_duration = 0.0

[solver]
kind = "extruded_inductionless"
mode = "steady"
linear_solver = "auto"
preconditioner = "jacobi"
time_scheme = "implicit_euler"
coupling_iterations = 6
coupling_tolerance = 1.0e-6

[fringing]
enabled = true
entry_center = 1.5
exit_center = 4.5
transition_width = 0.4
axis = "z"

[time_stepper]
dt = 0.002
t_final = 0.02
max_steps = 12
potential_iterations = 48
potential_tolerance = 1.0e-6
potential_relaxation = 1.0
potential_solver = "jacobi"
steady_tolerance = 1.0e-6
checkpoint_stride = 1

[output]
directory = "../artifacts/examples/toml_fringing_layered"
write_paraview = false
write_csv_profiles = true
write_npz = true
write_json_summary = true
write_plots = true
copy_input_file = true
write_stride = 1

[logging]
enabled = true
verbose = true
verbosity = "detailed"
banner = true
print_regions = true
print_boundaries = true
print_footer = true
flush = true
step_stride = 1

[restart]
enabled = false
write_restart = true
restart_filename = "fringing_layered_toml_extruded_restart.npz"

[[regions]]
name = "fluid"
kind = "fluid"
conductivity = 1.0
density = 1.0
viscosity = 0.05

[[regions]]
name = "conducting_wall"
kind = "solid"
conductivity = 0.5
density = 1.0
viscosity = 0.05
wall_thickness = 0.1

[[regions]]
name = "insulating_wall"
kind = "solid"
conductivity = 1.0e-12
density = 1.0
viscosity = 0.05
wall_thickness = 0.1

[[boundary_conditions]]
name = "left_wall"
kind = "insulating"
axis = "y"
side = "left"
region = "insulating_wall"

[[boundary_conditions]]
name = "right_wall"
kind = "insulating"
axis = "y"
side = "right"
region = "insulating_wall"

[[boundary_conditions]]
name = "bottom_wall"
kind = "conducting_wall"
axis = "z"
side = "bottom"
region = "conducting_wall"

[[boundary_conditions]]
name = "top_wall"
kind = "conducting_wall"
axis = "z"
side = "top"
region = "conducting_wall"
