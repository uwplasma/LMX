schema_version = 2

[[example]]
id = "hartmann-cli"
path = "examples/hartmann_case.toml"
command = "lmx examples/hartmann_case.toml"
status = "stable"
runtime = "portable"
outputs = ["solution NPZ", "diagnostics JSON", "profile CSV"]
docs = "docs/getting_started.md"

[[example]]
id = "hartmann-python"
path = "examples/hartmann_example.py"
command = "python examples/hartmann_example.py"
status = "stable"
runtime = "portable"
outputs = ["solution NPZ", "overview plots", "diagnostics JSON"]
docs = "docs/getting_started.md"

