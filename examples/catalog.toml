schema_version = 2

[[example]]
id = "hartmann-cli"
path = "examples/hartmann_case.toml"
command = "lmx examples/hartmann_case.toml"
status = "stable"
runtime = "portable"
outputs = ["solution", "diagnostics"]
docs = "docs/getting_started/first_run.md"

[[example]]
id = "hartmann-python"
path = "examples/hartmann_example.py"
command = "python examples/hartmann_example.py"
status = "stable"
runtime = "portable"
outputs = ["solution", "diagnostics"]
docs = "docs/getting_started/first_run.md"

[[example]]
id = "hunt-python"
path = "examples/hunt_example.py"
command = "python examples/hunt_example.py"
status = "stable"
runtime = "portable"
outputs = ["solution", "diagnostics"]
docs = "docs/tutorials/fully_developed.md"

[[example]]
id = "li-aln-wall-stack"
path = "examples/li_aln_wall_stack_example.py"
command = "python examples/li_aln_wall_stack_example.py"
status = "research-stage"
runtime = "portable"
outputs = ["wall-model comparison", "plots", "diagnostics"]
docs = "docs/tutorials/walls_and_fields.md"

[[example]]
id = "fringing-benchmark"
path = "examples/fringing_benchmark_demo.py"
command = "python examples/fringing_benchmark_demo.py"
status = "research-stage"
runtime = "portable"
outputs = ["internal conservation summary", "field/flow plots"]
docs = "docs/tutorials/fringing.md"

[[example]]
id = "blanket-design"
path = "examples/variable_field_extruded_demo.py"
command = "python examples/variable_field_extruded_demo.py"
status = "research-stage"
runtime = "portable"
outputs = ["bounded design controls", "gradient check", "optimization plot"]
docs = "docs/tutorials/differentiation.md"

[[example]]
id = "q2d-vortex-decay"
path = "examples/q2d_turbulence_demo.py"
command = "python examples/q2d_turbulence_demo.py"
