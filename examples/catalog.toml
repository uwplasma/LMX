schema_version = 2

[[example]]
id = "hartmann-cli"
path = "examples/hartmann_case.toml"
command = "lmx examples/hartmann_case.toml"
status = "stable"
runtime = "portable"
outputs = ["solution", "diagnostics"]
docs = "docs/getting_started.md"

[[example]]
id = "hartmann-python"
path = "examples/hartmann_example.py"
command = "python examples/hartmann_example.py"
status = "stable"
runtime = "portable"
outputs = ["solution", "plots", "diagnostics"]
docs = "docs/getting_started.md"

[[example]]
id = "hunt-python"
path = "examples/hunt_example.py"
command = "python examples/hunt_example.py"
status = "stable"
runtime = "portable"
outputs = ["solution", "plots", "diagnostics"]
docs = "docs/case_cookbook.md"

[[example]]
id = "operator-verification"
path = "examples/operator_verification_demo.py"
command = "python examples/operator_verification_demo.py"
status = "stable"
runtime = "portable"
outputs = ["observed order", "plots"]
docs = "docs/numerics.md"

[[example]]
id = "freemhd-validation"
path = "examples/freemhd_closed_channel_observable_parity.py"
command = "python -m examples.freemhd_closed_channel_observable_parity --reference-root /path/to/ClosedChannel"
status = "external-data"
runtime = "external"
outputs = ["observable comparison", "plots"]
docs = "docs/external_benchmarks.md"

[[example]]
id = "fringing-benchmark"
path = "examples/fringing_benchmark_demo.py"
command = "python examples/fringing_benchmark_demo.py"
status = "research-stage"
runtime = "portable"
outputs = ["summary", "station history", "plots"]
docs = "docs/fringing.md"

[[example]]
id = "restart"
path = "examples/extruded_restart_demo.py"
command = "python examples/extruded_restart_demo.py"
status = "research-stage"
runtime = "portable"
outputs = ["restart", "comparison"]
docs = "docs/case_cookbook.md"

[[example]]
id = "custom-field"
path = "examples/variable_field_extruded_demo.py"
command = "python examples/variable_field_extruded_demo.py"
status = "research-stage"
runtime = "portable"
outputs = ["field reconstruction", "solution summary"]
docs = "docs/geometry.md"

[[example]]
id = "differentiable-design"
path = "examples/autodiff_design_demo.py"
command = "python examples/autodiff_design_demo.py"
status = "research-stage"
runtime = "portable"
outputs = ["sensitivity", "design trace"]
docs = "docs/autodiff.md"

[[example]]
id = "cpu-gpu-benchmark"
path = "examples/strong_scaling_demo.py"
command = "python examples/strong_scaling_demo.py"
status = "research-stage"
runtime = "accelerator-optional"
outputs = ["timings", "scaling table"]
docs = "docs/performance.md"

[[example]]
id = "experimental-reference"
path = "examples/pipe_reference_comparison_demo.py"
