schema_version = 2

[[example]]
id = "hartmann-cli"
path = "examples/hartmann_case.toml"
command = "lmx examples/hartmann_case.toml"
status = "stable"
runtime = "portable"
outputs = ["solution", "diagnostics"]
docs = "docs/getting_started/first_run.md"

[[example]]
id = "hartmann-python"
path = "examples/hartmann_example.py"
command = "python examples/hartmann_example.py"
status = "stable"
runtime = "portable"
outputs = ["solution", "diagnostics"]
docs = "docs/getting_started/first_run.md"

