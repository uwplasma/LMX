[case]
name = "fringing_tabulated_toml"
forcing = 1.0
initial_velocity = 0.0
reference_pressure_gradient = -1.0
reference_phi_cell = [0, 0]
notes = "Explicit 3D rectangular fringing-field example using a tabulated magnetic field."

[geometry]
kind = "rect_duct"
width = 2.4
height = 1.6
length = 6.0
nx = 11
ny = 14
nz = 14

[magnetic_field]
kind = "tabulated"
table_path = "tabulated_rect_field.npz"
ramp_start = 0.0
ramp_duration = 0.0

[solver]
kind = "extruded_inductionless"
mode = "steady"
linear_solver = "auto"
preconditioner = "jacobi"
time_scheme = "implicit_euler"
coupling_iterations = 6
coupling_tolerance = 1.0e-6

[fringing]
enabled = true
entry_center = 1.5
exit_center = 4.5
transition_width = 0.35
axis = "z"

[time_stepper]
dt = 0.002
t_final = 0.02
max_steps = 12
potential_iterations = 48
potential_tolerance = 1.0e-6
potential_relaxation = 1.0
potential_solver = "jacobi"
steady_tolerance = 1.0e-6
checkpoint_stride = 1

[output]
directory = "../artifacts/examples/toml_fringing_tabulated"
write_paraview = false
write_csv_profiles = true
write_npz = true
write_json_summary = true
write_plots = true
copy_input_file = true
write_stride = 1

[[regions]]
name = "fluid"
kind = "fluid"
conductivity = 1.0
density = 1.0
viscosity = 0.05

[[boundary_conditions]]
name = "y_min_wall"
kind = "no_slip"
axis = "y"
side = "min"

[[boundary_conditions]]
name = "y_max_wall"
kind = "no_slip"
axis = "y"
side = "max"

[[boundary_conditions]]
name = "z_min_wall"
kind = "insulating"
axis = "z"
side = "min"

[[boundary_conditions]]
name = "z_max_wall"
kind = "insulating"
axis = "z"
side = "max"

