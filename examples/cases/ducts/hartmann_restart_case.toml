[case]
name = "hartmann_ha20_toml"
forcing = 1.0
initial_velocity = 0.0
reference_pressure_gradient = -1.0
reference_phi_cell = [0, 0]
notes = "Restart/continue example for `lmx input.toml`. Run hartmann_case.toml first, then continue from the saved state."

[geometry]
kind = "rect_duct"
width = 2.0
height = 2.0
length = 1.0
nx = 1
ny = 32
nz = 32
wall_thickness = [0.0, 0.0, 0.0, 0.0]
wall_cells = [0, 0, 0, 0]
target_ha = 20.0

[magnetic_field]
kind = "constant"
value = [0.0, 0.0, 20.0]
ramp_start = 0.0
ramp_duration = 0.0

[solver]
kind = "fully_developed_inductionless"
mode = "steady"
linear_solver = "auto"
preconditioner = "jacobi"
time_scheme = "implicit_euler"
coupling_iterations = 16
coupling_tolerance = 1.0e-8

[time_stepper]
dt = 0.002
t_final = 0.8
max_steps = 200
potential_iterations = 400
potential_tolerance = 1.0e-6
potential_relaxation = 1.0
potential_solver = "cg"
steady_tolerance = 1.0e-8
steady_potential_tolerance = 1.0e-6
checkpoint_stride = 1

[output]
directory = "../artifacts/examples/toml_hartmann_restart"
write_paraview = true
write_csv_profiles = true
write_npz = true
write_json_summary = true
write_plots = true
copy_input_file = true
write_stride = 1

[logging]
enabled = true
verbose = true
verbosity = "detailed"
banner = true
print_regions = true
print_boundaries = true
print_footer = true
flush = true
step_stride = 1

[restart]
enabled = true
path = "../artifacts/examples/toml_hartmann/hartmann_ha20_toml_results.npz"
reset_histories = false
write_restart = true
restart_filename = "hartmann_ha20_toml_restart.npz"

[[regions]]
name = "fluid"
kind = "fluid"
conductivity = 1.0
density = 1.0
viscosity = 0.01

[[boundary_conditions]]
name = "y_min_wall"
kind = "no_slip"
axis = "y"
side = "min"

[[boundary_conditions]]
name = "y_max_wall"
kind = "no_slip"
axis = "y"
side = "max"

[[boundary_conditions]]
name = "z_min_wall"
kind = "insulating"
axis = "z"
side = "min"

[[boundary_conditions]]
name = "z_max_wall"
kind = "insulating"
axis = "z"
side = "max"

