[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmx"
version = "0.1.0"
description = "JAX-native laminar inductionless MHD toolkit inspired by FreeMHD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jax>=0.9.0",
  "jaxlib>=0.9.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
extras = [
  "lineax>=0.0.8",
  "interpax>=0.3.6",
]

[project.scripts]
lmx = "lmx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lmx*"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
