[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmx"
version = "1.0.0"
description = "JAX-native inductionless MHD toolkit for research, benchmarking, and differentiable simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "jax",
  "jaxlib",
  "matplotlib",
  "numpy",
  "scipy",
  "tomli; python_version < '3.11'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "lineax",
  "interpax",
]
docs = [
  "sphinx",
  "myst-parser",
  "furo",
  "sphinx-copybutton",
]

[project.scripts]
lmx = "lmx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lmx*"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: fast local checks for isolated functionality",
  "regression: deterministic golden-profile and serialized-output checks",
  "physics: physics-level invariants for the current solver implementation",
  "validation: validation and parity harness checks",
]
