[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmx"
version = "1.0.0"
description = "JAX-native inductionless MHD toolkit for research, benchmarking, and differentiable simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jax>=0.9.0",
  "jaxlib>=0.9.0",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "matplotlib>=3.9",
  "pytest>=8.0",
  "pytest-cov>=7.0",
]
plotting = [
  "matplotlib>=3.9",
]
extras = [
  "lineax>=0.0.8",
  "interpax>=0.3.6",
]
docs = [
  "sphinx>=8.0",
  "myst-parser>=3.0",
  "furo>=2024.1.29",
  "sphinx-copybutton>=0.5",
]

[project.scripts]
lmx = "lmx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lmx*"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: fast local checks for isolated functionality",
  "regression: deterministic golden-profile and serialized-output checks",
  "physics: physics-level invariants for the current solver implementation",
  "validation: validation and parity harness checks",
]
