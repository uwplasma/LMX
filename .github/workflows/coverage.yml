name: full coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  package-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-lmx

      - name: Verify provenance and dependency lock
        run: python scripts/manage_provenance.py --check

      - name: Run full package coverage gate
        run: python scripts/run_full_test_suite.py --budget-seconds 600

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-coverage
          path: |
            coverage.xml
            artifacts/tests/full-suite-junit.xml
          if-no-files-found: ignore
