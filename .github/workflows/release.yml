name: release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optional package publish target
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lmx
        with:
          extras: dev,docs
      - name: Verify metadata
        run: python scripts/manage_provenance.py --check
      - name: Enforce architecture budgets
        run: python scripts/audit_architecture.py --check --measure-import
      - name: Run portable quality gate
        run: python scripts/run_full_test_suite.py --budget-seconds 600
      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lmx
        with:
          extras: release
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/audit_architecture.py --check --wheel dist/*.whl
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/lmx-wheel-check
          /tmp/lmx-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/lmx-wheel-check/bin/python -c "import lmx; import lmx.solvers"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lmx
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/lmx
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
