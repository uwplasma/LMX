name: release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Optional package publish target after validation and build."
        required: true
        default: "none"
        type: choice
        options:
          - none
          - testpypi
  release:
    types:
      - published

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  validation-gate:
    name: selected validation artifact gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with release-gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,docs]

      - name: Run fast research gate
        run: python -m pytest -m "unit or validation" -q

      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html

      - name: Generate selected validation artifacts
        run: |
          python scripts/run_validation_suite.py --output artifacts/release/validation
          python scripts/run_convergence_suite.py --output artifacts/release/convergence --cases hartmann --ha 5 --resolutions 8,16,32
          python scripts/run_time_convergence_suite.py --output artifacts/release/time_convergence --cases hartmann --ha 5 --resolution 16 --dts 0.004,0.002,0.001
          python scripts/run_freemhd_parity_suite.py --output artifacts/release/freemhd_parity
          python examples/q2d_decay_validation.py
          python examples/q2d_forced_validation.py
          python examples/q2d_wall_bounded_validation.py
          python examples/q2d_turbulence_decay_demo.py
          mkdir -p artifacts/release/q2d
          cp -R artifacts/examples/q2d_decay_validation artifacts/release/q2d/
          cp -R artifacts/examples/q2d_forced_validation artifacts/release/q2d/
          cp -R artifacts/examples/q2d_wall_bounded_validation artifacts/release/q2d/
          cp -R artifacts/examples/q2d_turbulence_decay artifacts/release/q2d/

      - name: Build release validation summary
        run: |
          python scripts/summarize_ci_artifacts.py \
            --validation-summary artifacts/release/validation/summary.json \
            --parity-summary artifacts/release/freemhd_parity/summary.json \
            --output-json artifacts/release/summary-report.json \
            --output-md artifacts/release/summary-report.md
          python scripts/run_release_readiness.py --output artifacts/release/release_readiness.json

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-artifacts
          path: |
            artifacts/release
            docs/_build/html

  build:
    name: build and inspect distributions
    runs-on: ubuntu-latest
    needs:
      - validation-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/lmx-wheel-check
          /tmp/lmx-wheel-check/bin/python -m pip install --upgrade pip
          /tmp/lmx-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/lmx-wheel-check/bin/python -c "import lmx; import lmx.solvers; import lmx.validation"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lmx
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/lmx
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
