name: release

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Optional package publish target
        required: true
        default: none
        type: choice
        options: [none, testpypi, pypi]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  external-validation:
    uses: ./.github/workflows/external-validation.yml

  validation:
    uses: ./.github/workflows/ci.yml

  documentation:
    uses: ./.github/workflows/docs.yml

  build:
    needs: [external-validation, validation, documentation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-lmx
        with:
          extras: release
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/audit_architecture.py --check \
            --wheel dist/*.whl --sdist dist/*.tar.gz
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/lmx-wheel-check
          /tmp/lmx-wheel-check/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          cd /tmp
          /tmp/lmx-wheel-check/bin/lmx --help >/dev/null
          /tmp/lmx-wheel-check/bin/python - <<'PY'
          import jax
          import jax.numpy as jnp

          from lmx import make_hartmann_case, solve, solve_fully_developed_fields
          from lmx.validation import (
              load_benchmark_a_spec,
              load_benchmark_b_reference,
              load_benchmark_b_spec,
              load_samper_table_i,
          )

          for name in ("shercliff", "hunt"):
              load_benchmark_a_spec(name)
          for name in ("B1-fringing-pipe", "B2-fringing-square"):
              load_benchmark_b_spec(name)
              load_benchmark_b_reference(name)
          load_samper_table_i()
          solution = solve(make_hartmann_case(ha=5, ny=4, nz=4))
          assert solution.state.residual < 1e-7
          case = make_hartmann_case(ha=5, ny=4, nz=4)
          value, derivative = jax.jit(jax.value_and_grad(
              lambda scale: jnp.mean(
                  solve_fully_developed_fields(case, magnetic_field_scale=scale)[0]
              )
          ))(jnp.asarray(1.0))
          assert jnp.isfinite(value)
          assert jnp.isfinite(derivative)
          PY
      - name: Save distributions for publishing
        uses: actions/cache/save@v6
        with:
          path: dist
          key: lmx-distributions-${{ github.run_id }}-${{ github.sha }}

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lmx
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: dist
          key: lmx-distributions-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/lmx
    steps:
      - uses: actions/cache/restore@v6
        with:
          path: dist
          key: lmx-distributions-${{ github.run_id }}-${{ github.sha }}
          fail-on-cache-miss: true
      - uses: pypa/gh-action-pypi-publish@release/v1
