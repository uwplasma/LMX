name: benchmarks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run benchmark suite
        run: python scripts/run_benchmark_suite.py --output artifacts/benchmarks/benchmark.json --repeats 2

      - name: Build benchmark summary
        run: |
          python scripts/summarize_ci_artifacts.py \
            --benchmark-report artifacts/benchmarks/benchmark.json \
            --output-json artifacts/benchmarks/summary-report.json \
            --output-md artifacts/benchmarks/summary-report.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: artifacts/benchmarks
