name: benchmarks

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-lmx

      - name: Verify provenance and dependency lock
        run: python scripts/manage_provenance.py --check

      - name: Run benchmark suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python scripts/run_benchmark_suite.py --output artifacts/benchmarks/benchmark.json --repeats 2

      - name: Build benchmark summary
        run: |
          python scripts/summarize_ci_artifacts.py \
            --benchmark-report artifacts/benchmarks/benchmark.json \
            --output-json artifacts/benchmarks/summary-report.json \
            --output-md artifacts/benchmarks/summary-report.md

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-artifacts
          path: artifacts/benchmarks
