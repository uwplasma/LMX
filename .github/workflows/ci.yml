name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run pytest suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pytest -m unit \
            tests/test_cases.py \
            tests/test_config.py \
            tests/test_units_and_wall_models.py \
            tests/test_physics.py \
            tests/test_mesh.py \
            tests/test_linear.py \
            tests/test_q2d.py \
            tests/test_wall_study.py \
            tests/test_release_readiness.py \
            tests/test_package_api.py \
            tests/test_reference_data.py

      - name: Run bounded release-readiness check
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python scripts/run_release_readiness.py --output artifacts/ci/release_readiness.json

  bounded-validation-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run bounded solver validation artifacts
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python scripts/run_validation_suite.py \
            --output artifacts/ci/validation \
            --resolution 8 \
            --skip-paraview

      - name: Verify external-reference parity contract
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          LMX_FREEMHD_INSTALL_DIR: artifacts/ci/empty_freemhd_install
          LMX_FREEMHD_PROCESSED_ROOT: artifacts/ci/empty_freemhd_processed
        run: python scripts/run_freemhd_parity_suite.py --output artifacts/ci/freemhd_parity

      - name: Upload bounded validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bounded-validation-artifacts
          path: |
            artifacts/ci/validation
            artifacts/ci/freemhd_parity

  convergence-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run bounded mesh-convergence artifacts
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python scripts/run_convergence_suite.py \
            --output artifacts/ci/convergence \
            --cases hartmann \
            --ha 5 \
            --resolutions 8,12
          python scripts/run_time_convergence_suite.py \
            --output artifacts/ci/time_convergence \
            --cases hartmann \
            --ha 5 \
            --resolution 8 \
            --dts 0.004,0.002 \
            --t-final 0.004

      - name: Upload convergence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: convergence-artifacts
          path: |
            artifacts/ci/convergence
            artifacts/ci/time_convergence

  q2d-validation-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run bounded Q2D validation artifacts
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python examples/q2d_decay_validation.py
          python examples/q2d_forced_validation.py
          python examples/q2d_wall_bounded_validation.py
          python examples/q2d_turbulence_decay_demo.py
          mkdir -p artifacts/ci/q2d
          cp -R artifacts/examples/q2d_decay_validation artifacts/ci/q2d/
          cp -R artifacts/examples/q2d_forced_validation artifacts/ci/q2d/
          cp -R artifacts/examples/q2d_wall_bounded_validation artifacts/ci/q2d/
          cp -R artifacts/examples/q2d_turbulence_decay artifacts/ci/q2d/

      - name: Upload Q2D artifacts
        uses: actions/upload-artifact@v4
        with:
          name: q2d-validation-artifacts
          path: artifacts/ci/q2d

  release-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run regression and physics suites
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python -m pytest -m "regression or physics"

  validation-artifacts:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run validation artifact suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python scripts/run_validation_suite.py --output artifacts/validation

      - name: Run convergence artifact suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python scripts/run_convergence_suite.py --output artifacts/convergence --cases hartmann --ha 5 --resolutions 8,16,32

      - name: Run time-convergence artifact suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python scripts/run_time_convergence_suite.py --output artifacts/time_convergence --cases hartmann --ha 5 --resolution 16 --dts 0.004,0.002,0.001

      - name: Run control-sweep artifact suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python scripts/run_solver_control_sweep.py --output artifacts/control_sweep --case hartmann --ha 20 --resolution 32 --parameter potential_iterations --values 50,100,200,400,800 --value-type int

      - name: Run FreeMHD parity artifact suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python scripts/run_freemhd_parity_suite.py --output artifacts/freemhd_parity

      - name: Run Q2D reduced-model artifact suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python examples/q2d_decay_validation.py
          python examples/q2d_forced_validation.py
          python examples/q2d_wall_bounded_validation.py
          mkdir -p artifacts/q2d
          cp -R artifacts/examples/q2d_decay_validation artifacts/q2d/
          cp -R artifacts/examples/q2d_forced_validation artifacts/q2d/
          cp -R artifacts/examples/q2d_wall_bounded_validation artifacts/q2d/

      - name: Build validation summary
        run: |
          python scripts/summarize_ci_artifacts.py \
            --validation-summary artifacts/validation/summary.json \
            --parity-summary artifacts/freemhd_parity/summary.json \
            --control-sweep-summary artifacts/control_sweep/summary.json \
            --output-json artifacts/validation/summary-report.json \
            --output-md artifacts/validation/summary-report.md

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            artifacts/validation
            artifacts/convergence
            artifacts/time_convergence
            artifacts/control_sweep
            artifacts/freemhd_parity
            artifacts/q2d

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pytest-cov

      - name: Run coverage suite
        env:
          MPLBACKEND: Agg
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
          XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python -m pytest \
            --cov=lmx \
            --cov=scripts \
            --cov-branch \
            --cov-fail-under=95 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --cov-report=json:artifacts/coverage/coverage.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage
