name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=1
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-lmx
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify metadata
        run: python scripts/manage_provenance.py --check
      - name: Run all tests and branch coverage
        run: python scripts/run_full_test_suite.py --budget-seconds 600
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-py${{ matrix.python-version }}
          path: |
            coverage.xml
            artifacts/tests/full-suite-junit.xml
          if-no-files-found: ignore
