name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - regression
          - physics
          - validation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run pytest suite
        run: python -m pytest -m "${{ matrix.suite }}"

  validation-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run validation artifact suite
        run: python scripts/run_validation_suite.py --output artifacts/validation

      - name: Build validation summary
        run: |
          python scripts/summarize_ci_artifacts.py \
            --validation-summary artifacts/validation/summary.json \
            --output-json artifacts/validation/summary-report.json \
            --output-md artifacts/validation/summary-report.md

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: artifacts/validation
