name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - unit
          - regression
          - physics
          - validation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run pytest suite
        run: python -m pytest -m "${{ matrix.suite }}"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,docs]

      - name: Build documentation
        run: python -m sphinx -W -b html docs docs/_build/html

  validation-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run validation artifact suite
        run: python scripts/run_validation_suite.py --output artifacts/validation

      - name: Run convergence artifact suite
        run: python scripts/run_convergence_suite.py --output artifacts/convergence --cases hartmann --ha 5 --resolutions 8,16,32

      - name: Run FreeMHD parity artifact suite
        run: python scripts/run_freemhd_parity_suite.py --output artifacts/freemhd_parity

      - name: Build validation summary
        run: |
          python scripts/summarize_ci_artifacts.py \
            --validation-summary artifacts/validation/summary.json \
            --parity-summary artifacts/freemhd_parity/summary.json \
            --output-json artifacts/validation/summary-report.json \
            --output-md artifacts/validation/summary-report.md

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            artifacts/validation
            artifacts/convergence
            artifacts/freemhd_parity

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run coverage suite
        run: |
          python -m pytest \
            --cov=lmx \
            --cov=scripts \
            --cov-branch \
            --cov-fail-under=85 \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:artifacts/coverage/coverage.xml \
            --cov-report=json:artifacts/coverage/coverage.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coverage
